plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spdev.mypetgolu'
    compileSdk 34

    defaultConfig {
        applicationId "com.spdev.mypetgolu"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "0.5.0"
    }

    // Stable debug key: when the repo's debug.keystore exists (CI restores it
    // from debug.keystore.b64), every build signs with the same key, so updates
    // install over older versions. Without it, AGP falls back to its own
    // generated debug key as usual.
    def debugKs = rootProject.file("debug.keystore")
    if (debugKs.exists()) {
        signingConfigs {
            debug {
                storeFile debugKs
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
