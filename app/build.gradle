plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spdev.mypetgolu'
    compileSdk 34

    defaultConfig {
        applicationId "com.spdev.mypetgolu"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "3.1"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
